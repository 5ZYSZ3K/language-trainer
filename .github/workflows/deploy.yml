name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Re-scrape every verb instead of only the missing ones
        type: boolean
        default: false

# Needed to push the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A first or forced scrape fetches every verb one at a time, a few seconds each.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore previously scraped data from gh-pages
        run: |
          mkdir -p public/data
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git show origin/gh-pages:data/verb-present-tense.json > public/data/verb-present-tense.json \
              || rm -f public/data/verb-present-tense.json
          else
            echo "No gh-pages branch yet, starting from scratch."
          fi

      # Verbs that fail are left out of the data (and so out of the site) and make this step fail,
      # but the site is still built and deployed with everything that worked. See the last step.
      - name: Scrape missing verbs
        id: scrape
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: npm run scrape -- $FORCE

      - name: Check there is data to publish
        run: test -s public/data/verb-present-tense.json

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages

      - name: Report scrape failures
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::Some verbs could not be scraped; they are missing from the deployed site. See the 'Scrape missing verbs' step."
          exit 1
